# Slaytlar: "Deployment" ve "Deployment YAML". Container adı nginx: set image komutu buna göre yazılır.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web          # Deployment hangi Pod'ları yönetir
  template:
    metadata:
      labels:
        app: web        # selector ile BİREBİR aynı olmalı
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
