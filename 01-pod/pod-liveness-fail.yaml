# The liveness probe fails on purpose: the container is restarted again and again (RESTARTS grows).
apiVersion: v1
kind: Pod
metadata:
  name: liveness-fail
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      livenessProbe:
        httpGet:
          path: /yok-boyle-bir-yol
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 3
        failureThreshold: 2
