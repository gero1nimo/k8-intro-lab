# Slide: "Probes" - readiness: ready for traffic? liveness: still alive?
apiVersion: v1
kind: Pod
metadata:
  name: hello-probes
  labels:
    app: hello-probes
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
