# Symptom: the Service exists but its endpoints are empty. Cause: selector "wbe" (typo) vs Pod label "web".
# Check: kubectl get endpoints broken-svc   Fix: set the selector to app: web.
apiVersion: v1
kind: Service
metadata:
  name: broken-svc
spec:
  selector:
    app: wbe
  ports:
    - port: 80
      targetPort: 80
