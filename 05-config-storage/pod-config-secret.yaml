# A Pod that uses the ConfigMap as env vars and as a file, and the Secret as an env var.
# First run: kubectl create secret generic db-pw --from-literal=password=change-me
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-pw
              key: password
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html
      configMap:
        name: app-config
        items:
          - key: index.html
            path: index.html
